name: Set up toolchain
description: Install the pinned Node and Python toolchains and project dependencies.

inputs:
  browser:
    description: Also install the evaluation dependencies and the Playwright browser.
    default: "false"

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
      with:
        version: 11.19.0
    - uses: actions/setup-node@v4
      with:
        node-version-file: .node-version
        cache: pnpm
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip
    - run: pnpm install --frozen-lockfile
      shell: bash
    - run: python -m pip install -r requirements.lock
      shell: bash
    - if: inputs.browser == 'true'
      run: |
        python -m pip install -r eval/requirements-baseline.txt -r eval/requirements-cloud.txt
        python -m playwright install --with-deps chromium
      shell: bash
